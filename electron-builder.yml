appId: top.lime-store.client
productName: LimeStore
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Office
  executableName: lime-store
  syncDesktopName: true
  synopsis: LimeStore desktop client
  maintainer: LimeStore <dev@lime-store.top>
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LimeStore
  artifactName: LimeStore-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
